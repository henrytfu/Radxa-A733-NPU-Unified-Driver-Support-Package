# Take this configuration with a pinch of salt, as it was generated by Gemini
# Information about drivers are hard to come by, so this was the best I could realistically do.
# Treat it as a starting point

# Configuration for the Vivante Unified NPU Driver (galcore)

# contiguousSize: Sets the size of the reserved DMA memory pool.
# For 1GB RAM systems, 128MB (0x8000000) is usually a safe balance for YOLOv8.
# 0x4000000 = 64MB, 0x8000000 = 128MB, 0x10000000 = 256MB
options galcore contiguousSize=0x8000000

# baseAddress: Usually 0 on modern kernels with device-tree support.
options galcore baseAddress=0

# irqLine: Usually handled by device-tree, but can be forced here if needed.
# options galcore irqLine=...

# powerManagement: 1 = Enable, 0 = Disable. 
# Disable if you experience "stuck" NPU issues during inference.
options galcore powerManagement=1